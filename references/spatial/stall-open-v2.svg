    <line x1="80" y1="390" x2="274" y2="390" stroke="#9a1f1f" stroke-width="8" stroke-dasharray="18 12"/>
    <line x1="420" y1="235" x2="606" y2="235" stroke="#9a1f1f" stroke-width="8" stroke-dasharray="18 12"/>

