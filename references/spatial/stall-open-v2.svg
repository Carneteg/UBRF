  <g transform="translate(120,150)">
    <rect x="0" y="0" width="354" height="600" fill="#eef5ee" stroke="#222" stroke-width="4"/>
    <rect x="354" y="0" width="318" height="336" fill="#eef5ee" stroke="#222" stroke-width="4"/>

    <text x="177" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700">OPEN AREA</text>
    <text x="177" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">UPPEHÅLLSRUM</text>
    <text x="513" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700">OPEN AREA</text>
    <text x="513" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">UPPEHÅLLSRUM</text>

