<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridskolan</title>
<!-- Ikonen ligger i filen, som allt annat. Utan den frågar webbläsaren
     efter /favicon.ico och får 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181B21'/%3E%3Cpath d='M11 24V14a5 5 0 0 1 10 0v10' fill='none' stroke='%23D6AE3C' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Inga webbfonter. Spelet ska gå att öppna utan nät, och en länk till
     Google Fonts är just ett nätanrop vid körning. Typsnitten nedan är
     de vi ritar för; finns de inte i systemet tar reserverna vid. -->
<style>
/* Spelet committar till ett visuellt uttryck: kall stallmorgon, varm sand.
   Ingen temaväxling — men varje färg är målad, inget ärvs från värden. */
:root{
  --ground:#101216; --panel:#181B21; --panel-2:#1F232A; --sunk:#0B0D10;
  --ink:#E6E4DE; --ink-2:#C2C1BB; --muted:#8E939B; --faint:#666B73;
  --rule:#2A2E35; --rule-soft:#22262C;
  --gold:#D6AE3C; --gold-2:#E7C86B; --gold-wash:#2A2415;
  --crit:#D0655A; --crit-wash:#2C1917;
  --ok:#7FB489;
  --sand:#C9BFA6; --sand-2:#B8AC8E; --sand-dark:#8E856D;
  --p1:#4A737E; --p2:#56888A; --p3:#5F9C85; --p4:#86AE79; --p5:#C0B063; --p6:#D6AE3C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Petrona,Georgia,serif; margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.lbl{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:#8D939C; font-weight:600}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:2px}

#app{position:fixed; inset:0}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; background:var(--ground)}
/* WebGL-lagret ligger under 2D-canvasen; när 3D är aktivt blir 2D-lagret
   genomskinligt och används bara till regn och skärmtext. */
#gl{position:absolute; inset:0; width:100%; height:100%; display:none; background:var(--ground)}
#app.gl3d #gl{display:block}
#app.gl3d #cv{background:transparent}

/* ── HUD ─────────────────────────────────────────────────────── */
/* Egen klass, inte .hud: ui.css har en egen .hud (nivåraden ur ui-kit-demo)
   och den laddas efter det här, så den vann och sköt HUD-rutorna ur läge. */
.hudh{position:absolute; pointer-events:none; z-index:5}
.hudh.tl{top:14px; left:14px}
.hudh.tr{top:14px; right:14px; text-align:right}
.hudh.bl{bottom:14px; left:14px}
.hudh.br{bottom:14px; right:14px}
.hudh.bc{bottom:16px; left:50%; transform:translateX(-50%); text-align:center; width:min(560px,86vw)}
.hudh.tc{top:14px; left:50%; transform:translateX(-50%); text-align:center; width:min(560px,86vw)}

.box{background:rgba(14,16,20,.94); border:1px solid rgba(214,174,60,.22); border-radius:4px;
  padding:11px 14px; backdrop-filter:blur(8px);
  box-shadow:0 6px 26px -6px rgba(0,0,0,.85)}

/* moment */
#moment{min-width:250px; max-width:min(360px,42vw)}
#momentNamn{font-family:Petrona,serif; font-size:20px; line-height:1.2; color:#F4F1E8}
#momentText{font-size:14px; color:#DCD9D1; margin-top:5px; line-height:1.5}
#momentBar{height:3px; background:var(--sunk); border-radius:2px; margin-top:10px; overflow:hidden}
#momentBar i{display:block; height:100%; background:var(--gold); width:0%; transition:width .3s linear}
/* Stapeln lyser medan kravet hålls. Det är den enda återkopplingen som
   syns i ögonvrån utan att man tittar bort från hästen. */
#momentBar.haller i{background:var(--emerald); box-shadow:0 0 8px var(--emerald)}
#momentMal{font-size:11px; opacity:.72; margin-top:5px; letter-spacing:.02em}
/* Hur hästen är idag, sagt med ord i stället för som en mätare. Det är
   meningen att spelaren ska lära sig läsa hästen, inte en siffra. */
.humor{margin:6px 0 0; font-style:italic; opacity:.9}
/* Raderna ligger i momentrutan, inte i en egen — HUD:en har inte plats
   för fler paneler på en liten skärm. */
#vaxer{margin-top:9px; padding-top:8px; border-top:1px solid rgba(255,255,255,.14)}
.vaxrad{display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px}
.vaxrad span{flex:1; white-space:nowrap}
.vaxrad b{display:block; width:74px; height:6px; background:var(--sunk);
  border-radius:3px; overflow:hidden}
.vaxrad b i{display:block; height:100%; width:0%; background:var(--emerald);
  transition:width .25s ease-out}
/* Blixten när en färdighet passerar ett helt steg. Kort och tyst — det
   ska kännas som en klapp på axeln, inte som en nivåhöjning i ett
   mobilspel. */
#fardBlixt{position:fixed; left:50%; top:22%; transform:translateX(-50%);
  background:var(--panel-top); color:var(--cream); border:2px solid var(--gold);
  border-radius:14px; padding:10px 18px; font-weight:700; pointer-events:none;
  opacity:0; transition:opacity .4s ease, transform .4s ease; z-index:60}
#fardBlixt.pa{opacity:1; transform:translateX(-50%) translateY(-8px)}

/* gångart */
#gait{font-family:Petrona,serif; font-size:27px; line-height:1; color:#F4F1E8}
#tempo{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:#A6ABB3;
  font-variant-numeric:tabular-nums; margin-top:3px}
#gaitWarn{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--crit); margin-top:5px; min-height:14px;
  font-variant-numeric:tabular-nums}
/* Egenskapen Känsla visar spänningen hela tiden, inte bara varningen.
   Färgen stiger med värdet så man ser den bygga upp sig. */
#gaitWarn.lag{color:var(--muted)} #gaitWarn.mitt{color:var(--gold-2)}
#gaitWarn.hog{color:var(--crit)}

/* pyramid */
#pyr{width:210px}
.prow{display:grid; grid-template-columns:70px 1fr; gap:7px; align-items:center; margin:2px 0}
.pname{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; color:#A6ABB3; text-align:right; white-space:nowrap}
.ptrack{position:relative; height:9px; background:var(--sunk); border-radius:1px}
.pfill{position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); border-radius:1px}
.pcap{position:absolute; top:-2px; bottom:-2px; left:50%; transform:translateX(-50%);
  border-left:1.5px solid var(--crit); border-right:1.5px solid var(--crit); opacity:0}
.pcap.on{opacity:1}
#inverkan{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted);
  margin-top:9px; padding-top:8px; border-top:1px solid var(--rule-soft);
  display:flex; justify-content:space-between; font-variant-numeric:tabular-nums}
#inverkan b{color:var(--gold); font-weight:500}

/* hjälper */
#aids{width:180px}
.arow{display:grid; grid-template-columns:52px 1fr 26px; gap:7px; align-items:center; margin:3px 0}
.aname{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.05em;
  text-transform:uppercase; color:#A6ABB3; text-align:right}
.atrack{position:relative; height:7px; background:var(--sunk); border-radius:1px; overflow:hidden}
.atrack i{position:absolute; top:0; bottom:0; background:var(--gold); border-radius:1px}
.atrack .band{position:absolute; top:0; bottom:0; background:rgba(127,180,137,.22)}
.akey{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:#8D939C; text-align:left}

/* ridlärarens röst */
#saga{font-family:Petrona,serif; font-size:21px; font-style:italic; color:#F6F2E8;
  opacity:0; transition:opacity .35s; min-height:1.5em;
  text-shadow:0 2px 4px rgba(0,0,0,.95), 0 0 18px rgba(0,0,0,.85)}
#saga.on{opacity:1}
#saga:not(:empty){display:inline-block; padding:8px 18px; border-radius:20px;
  background:rgba(12,14,18,.72); backdrop-filter:blur(7px);
  box-shadow:0 6px 26px -8px rgba(0,0,0,.9)}
#approach{font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:600;
  color:#F4DFA0; letter-spacing:.02em; margin-top:8px; min-height:20px;
  text-shadow:0 2px 4px rgba(0,0,0,.95)}
#approach:not(:empty){display:inline-block; padding:7px 16px; border-radius:4px;
  background:rgba(12,14,18,.86); border:1px solid rgba(214,174,60,.42);
  backdrop-filter:blur(7px); box-shadow:0 6px 22px -8px rgba(0,0,0,.9)}

/* fel-flash */
#faults{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:Petrona,serif; font-size:52px; color:var(--crit); opacity:0;
  text-shadow:0 4px 24px rgba(0,0,0,.9); pointer-events:none; z-index:6;
  transition:opacity .25s, transform .25s}

/* protokoll under hoppning */
#prot{width:200px; font-family:"IBM Plex Mono",monospace; font-size:11px}
#prot .r{display:flex; justify-content:space-between; padding:1.5px 0; color:var(--muted)}
#prot .r b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}
#prot .r.bad b{color:var(--crit)}

/* ── overlays ────────────────────────────────────────────────── */
#ov{position:absolute; inset:0; z-index:20; display:flex; align-items:center;
  justify-content:center; padding:20px; background:rgba(10,12,15,.90);
  backdrop-filter:blur(10px); overflow-y:auto}
#ov.hide{display:none}
.sheet{background:var(--panel); border:1px solid var(--rule); border-radius:4px;
  padding:clamp(22px,3.5vw,34px); width:min(760px,94vw); max-height:92vh; overflow-y:auto;
  box-shadow:0 24px 80px -20px rgba(0,0,0,.85)}
.sheet h1{font-size:clamp(26px,4vw,40px); line-height:1.05; margin-bottom:6px}
.sheet h2{font-size:22px; margin:1.5em 0 .4em}
.sheet p{margin:.8em 0; color:var(--ink-2); max-width:62ch}
.sheet ul{padding-left:1.2em; margin:.8em 0; color:var(--ink-2)}
.sheet li{margin:.3em 0}
.btn{display:inline-flex; align-items:center; gap:9px; background:var(--gold); color:#17140A;
  border:0; border-radius:3px; padding:11px 20px; font-size:14.5px; font-weight:600;
  cursor:pointer; transition:.15s; font-family:inherit}
.btn:hover{background:var(--gold-2)}
.btn.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--gold); color:var(--gold-2)}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; align-items:center}

.keys{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px 20px; margin:1.2em 0}
.keys div{display:flex; gap:10px; align-items:baseline; font-size:13.5px; color:var(--ink-2)}
kbd{font-family:"IBM Plex Mono",monospace; font-size:11px; background:var(--panel-2);
  border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; padding:2px 6px;
  color:var(--ink); white-space:nowrap; min-width:22px; text-align:center}

.hcard{display:flex; gap:18px; align-items:flex-start; background:var(--panel-2);
  border:1px solid var(--rule); border-radius:3px; padding:16px 18px; margin:1.2em 0}
.hcard .n{font-family:Petrona,serif; font-size:24px; line-height:1.1}
.hcard .k{font-size:13px; color:var(--muted); font-style:italic; margin-top:5px; max-width:44ch}
.hcard .tr{display:flex; gap:14px; flex-wrap:wrap; margin-top:11px}
.hcard .tr span{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted);
  letter-spacing:.05em; text-transform:uppercase}
.hcard .tr b{color:var(--ink); font-weight:500}
.hcard .why{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--gold-2);
  margin-top:11px; letter-spacing:.02em}

table{border-collapse:collapse; width:100%; font-size:13px; margin:1em 0}
th{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:500; text-align:left; padding:8px 10px; border-bottom:1px solid var(--rule)}
td{padding:7px 10px; border-bottom:1px solid var(--rule-soft); color:var(--ink-2)}
td.num,th.num{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

.note{border-left:3px solid var(--gold); background:var(--gold-wash); padding:13px 16px;
  border-radius:0 3px 3px 0; margin:1.2em 0; font-size:14px; color:var(--ink-2)}
.bad{border-left-color:var(--crit); background:var(--crit-wash)}

/* skötsel */
#groom{display:grid; grid-template-columns:1fr 260px; gap:24px; align-items:start}
@media(max-width:720px){#groom{grid-template-columns:1fr}}
#groomCanvas{position:relative; width:100%; aspect-ratio:4/3; background:var(--sunk); border:1px solid var(--rule);
  border-radius:3px; cursor:crosshair; touch-action:none; display:block}
.gstep{padding:9px 0; border-bottom:1px solid var(--rule-soft); font-size:13.5px; color:var(--muted);
  display:flex; justify-content:space-between; gap:10px; align-items:baseline; cursor:pointer}
.gstep.on{color:var(--ink)}
.gstep.on .gn{color:var(--gold)}
.gstep .gn{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint)}
.gstep .gv{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-variant-numeric:tabular-nums}
#groomHint{font-size:13.5px; color:var(--ink-2); margin-top:14px; min-height:3.4em; line-height:1.5}
/* Liggande mobil: skärmen är låg, inte smal. Då styr höjden rutans storlek
   — annars hamnar hästen nedanför skärmkanten. */
@media(max-height:560px) and (orientation:landscape){
  .sheet{padding:14px 18px; max-height:96vh}
  .sheet h1{font-size:20px; margin-top:0}
  .sheet p{margin:.4em 0; font-size:12.5px}
  .sheet>p.dim:first-of-type{display:none}
  .sheet .lbl{display:none}
  .sheet h1{margin-bottom:2px}
  #groom{grid-template-columns:auto 224px; gap:16px; margin-top:6px}
  #groomCanvas{width:auto; max-width:100%; height:62vh; margin:0}
  #groomHint{margin-top:8px; min-height:0; font-size:12px}
  .gstep{padding:5px 0; font-size:12.5px}
  /* Låg skärm: momentrutan tog halva höjden och la sig över replikbubblan. */
  .hudh.tl{max-width:32vw}
  #moment{max-width:32vw}
  #momentText{display:none}
}

/* ── Skaparrutan: utseendet och egenskaperna ─────────────────── */
#skapDelar{display:grid; grid-template-columns:230px 1fr; gap:22px; align-items:start;
  margin-top:14px}
#skapDuk{width:100%; aspect-ratio:3/4; background:var(--sunk); border:1px solid var(--rule);
  border-radius:3px; display:block}
.skapNamn input{width:100%; margin-top:9px; text-align:center; font-size:15px}
.skapFlikar{display:flex; gap:6px; margin-bottom:12px}
.skapFlik{background:transparent; border:1px solid var(--rule); color:var(--muted);
  padding:7px 14px; border-radius:3px; cursor:pointer; font-family:inherit; font-size:13px}
.skapFlik.pa{background:var(--gold); color:#17140A; border-color:var(--gold)}
.skapRad{display:flex; gap:10px; align-items:baseline; margin-bottom:9px; flex-wrap:wrap}
.skapEtikett{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint); min-width:76px}
.skapChipp{display:flex; gap:6px; flex-wrap:wrap; flex:1 1 200px}
.skapChip{display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--rule); color:var(--ink-2);
  border-radius:3px; padding:5px 9px; font-family:inherit; font-size:12px}
.skapChip:hover{border-color:var(--gold)}
.skapChip.pa{border-color:var(--gold); color:var(--ink); box-shadow:inset 0 0 0 1px var(--gold)}
.skapProv{width:13px; height:13px; border-radius:2px; background:var(--prov);
  border:1px solid rgba(0,0,0,.35); display:inline-block}
/* Egenskapskorten: namnet, vad det gör, och varför boken säger så. */
#egLista{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:9px}
.egKort{text-align:left; cursor:pointer; background:var(--panel-2); color:var(--ink-2);
  border:1px solid var(--rule); border-radius:3px; padding:10px 12px; font-family:inherit;
  display:flex; flex-direction:column; gap:4px}
.egKort:hover{border-color:var(--gold)}
.egKort.pa{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
.egKort.tom{opacity:.45}
.egNamn{font-size:15px; color:var(--ink); font-weight:600}
.egKort2{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--gold-2)}
.egEffekt{font-size:12.5px; line-height:1.45}
.egVarfor{font-size:11.5px; line-height:1.45; color:var(--faint); margin-top:2px}
.egRad{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:3px}
.egBricka{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em;
  border:1px solid var(--rule); border-radius:999px; padding:2px 9px; color:var(--gold-2)}
/* Ryttarprovet i menyn: hjälm, kavaj och ansikte i tre band. */
.jagProv{width:34px; height:34px; border-radius:3px; flex:0 0 auto;
  background:linear-gradient(180deg,
    var(--hjalm) 0 34%, var(--hy) 34% 52%, var(--kavaj) 52% 100%);
  border:1px solid var(--rule)}
/* Kontorutan */
.synkFalt{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px}
.synkFalt input{flex:1 1 150px; min-width:0}
.synkBesked{margin-top:8px; font-size:12.5px; color:var(--gold-2)}
.synkBesked.bad{color:var(--crit)}
@media(max-width:640px){
  #skapDelar{grid-template-columns:1fr}
  #skapDuk{max-width:220px; margin:0 auto}
  .skapEtikett{min-width:0; flex:1 0 100%}
}

/* topprad i spelet */
#topbar{position:absolute; top:0; left:0; right:0; height:0; z-index:7}
#viewToggle{position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:7;
  display:flex; gap:0; background:rgba(24,27,33,.9); border:1px solid var(--rule);
  border-radius:3px; overflow:hidden; backdrop-filter:blur(6px)}
#viewToggle button{background:transparent; border:0; color:var(--muted); cursor:pointer;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; padding:7px 13px; transition:.15s}
#viewToggle button.on{background:var(--gold); color:#17140A}
#viewToggle button:hover:not(.on){color:var(--ink)}

/* Tangentremsan: bara de tangenter gruppen faktiskt använder, och bara
   de tre första passen. Hela listan bor i träningsboken. */
#tangenter{margin-top:9px; padding-top:8px; border-top:1px solid var(--rule-soft)}
#tangenter .tRad{display:flex; align-items:center; gap:5px; margin-top:4px;
  font-size:11px; color:var(--muted); justify-content:flex-end}
#tangenter .tRad span{margin-left:2px}
#tangenter kbd{font-size:10px; padding:1px 5px}

.dim{color:var(--muted)}
.gold{color:var(--gold-2)}
.red{color:var(--crit)}
.grn{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── Små skärmar: krymp HUD:en, ge plats åt pekkontrollerna ──── */
@media(max-width:760px){
  body{font-size:14px}
  .box{padding:8px 10px}
  #moment{min-width:0; max-width:46vw}
  #momentNamn{font-size:15px}
  #momentText{font-size:11.5px}
  #gait{font-size:19px}
  #tempo{font-size:10.5px}
  #pyr{width:152px}
  #aids{width:142px}
  #saga{font-size:16px}
  #approach{font-size:11px}
  .hudh.tl{top:8px;left:8px}.hudh.tr{top:8px;right:8px}
  .hudh.bl{bottom:8px;left:8px}.hudh.br{bottom:8px;right:8px}
  .hudh.bc{bottom:10px}
  /* Vyknapparna satt i mitten och la sig över momentrutan på smal skärm.
     De flyttar ner under den i stället. */
  #viewToggle{top:auto; bottom:8px; left:50%}
  .sheet h1{font-size:24px}
}
@media(max-width:560px){
  #aids{display:none}
  #pyr{width:134px}
  .prow{grid-template-columns:56px 1fr; gap:5px}
