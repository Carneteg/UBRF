name: Alpha — webbstart

# Releasegrind: prova den distribution som Vercel faktiskt serverar.
# De bundlade ridtesterna ersätter inte denna kontroll.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-webbstart:
    # ubuntu-latest löser (2026-11) till Ubuntu 26.04, som den i package.json
    # låsta playwright@1.55.0 inte stödjer för `--with-deps`-installation av
    # Chromium ("Playwright does not support chromium on ubuntu26.04-x64").
    # Felet var deterministiskt och orelaterat till PR-innehåll — se PR #308.
    # Pinnat till en version Playwright 1.55.0 officiellt stödjer.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installera låsta publika beroenden
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Installera Chromium
        run: npx playwright install --with-deps chromium
      - name: Prova den obundlade webbdistributionen
        run: node tools/bootkoll.mjs
