name: Grindar

# Gaterna fanns redan i repot — de var bara frivilliga. Den här workflowen gör
# Lager B i docs/DELIVERY-PROTOCOL.md automatiskt och obligatoriskt: ingen kan
# längre säga "testerna är gröna" utan att exitkoden finns här att läsa.
#
# Varje steg är villkorat på att filen existerar. Det är avsiktligt: olika
# brancher har olika många kontroller, och en PR ska inte falla för att den
# ännu inte har en kontroll som en annan branch har infört.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  grindar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hämta luau
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o -q /tmp/luau.zip -d /tmp/luau
          sudo install -m 0755 /tmp/luau/luau /usr/local/bin/luau
          luau --help >/dev/null && echo "luau installerad"

      - name: Materialkontroll — ogiltigt Enum.Material fäller Studio
        run: |
          if [ -f tools/kolla-material.py ]; then python3 tools/kolla-material.py
          else echo "hoppar: tools/kolla-material.py finns inte i denna branch"; fi

      - name: Speldata i synk — src/spel/ mot Roblox-modulerna
        run: |
          if [ -f tools/exportera-spel.js ]; then node tools/exportera-spel.js --kontrollera
          else echo "hoppar: tools/exportera-spel.js finns inte i denna branch"; fi

      - name: Ridkanon i synk — src/model.js mot RidKanon.luau
        run: |
          if [ -f tools/exportera-ridkanon.mjs ]; then node tools/exportera-ridkanon.mjs --kontrollera
          else echo "hoppar: tools/exportera-ridkanon.mjs finns inte i denna branch"; fi

      - name: Geometri i synk — src/site.js mot UBRFKomplex.luau
        run: |
          if [ -f tools/exportera-geometri.js ]; then node tools/exportera-geometri.js --kontrollera
          else echo "hoppar: tools/exportera-geometri.js finns inte i denna branch"; fi

      - name: Dörrfärgsparitet webb/Roblox
        run: |
          if [ -f tools/kolla-dorrfarg.py ]; then python3 tools/kolla-dorrfarg.py
          else echo "hoppar: tools/kolla-dorrfarg.py finns inte i denna branch"; fi

      # Första dagens häst (#162 blockerare 3): produktregeln "ny spelare
      # rider Jack" står numera på två ställen — src/scenes.js och
      # roblox/game/Stallet.luau. Grinden ser till att de två aldrig blir
      # två SANNINGAR, och att hästen finns i den delade datan.
      - name: Första dagens häst — samma på webb och Roblox
        run: |
          if [ -f tools/kolla-forstadagen.py ]; then python3 tools/kolla-forstadagen.py
          else echo "hoppar: tools/kolla-forstadagen.py finns inte i denna branch"; fi

      - name: Rojo-projektkontroll
        run: |
          if [ -f tools/kolla-rojo.py ]; then python3 tools/kolla-rojo.py
          else echo "hoppar: tools/kolla-rojo.py finns inte i denna branch"; fi

      - name: VERIFIED kräver granskad nyckelbild
        run: |
          if [ -f tools/kolla-nyckelbilder.py ]; then python3 tools/kolla-nyckelbilder.py
          else echo "hoppar: tools/kolla-nyckelbilder.py finns inte i denna branch"; fi

      - name: Speglingsverktygets prov
        run: |
          if [ -f tools/prov-spegla.py ]; then python3 tools/prov-spegla.py
          else echo "hoppar: tools/prov-spegla.py finns inte i denna branch"; fi

      - name: Luau-specarna
        run: |
          if [ -f roblox/tests/kor.sh ]; then bash roblox/tests/kor.sh
          else echo "hoppar: roblox/tests/kor.sh finns inte i denna branch"; fi

      # Handigheten, webbens halva. roblox/tests/handighet.spec.luau mäter
      # Roblox i steget ovan; det här mäter webben mot SAMMA ankare ur
      # SITEPLAN. Båda behövs: en spegling överlever varje koordinatprov
      # och varje paritetsprov — är båda ytorna speglade likadant är de
      # överens om att ha fel. Det var precis så Roblox kunde vara
      # spegelvänt med alla grindar gröna.
      - name: Handigheten på webben
        run: |
          if [ -f tools/handighetsgrind.mjs ]; then node tools/handighetsgrind.mjs
          else echo "hoppar: tools/handighetsgrind.mjs finns inte i denna branch"; fi

      # PRE_TOBIAS_FIRST_PLAYABLE_GATE (processändringen på #162, 05:42).
      # Samlingsgrinden kör undergrindarna en gång till i ett svep och
      # producerar release evidence bundle + WORLD_MANIFEST. Den ligger
      # HÄR, efter specarna, därför att den ska vara det sista svaret på
      # frågan "får Tobias en ny .rbxlx?" — och den är fail closed.
      - name: PRE_TOBIAS_FIRST_PLAYABLE_GATE
        run: |
          if [ -f tools/pre-tobias-grind.py ]; then python3 tools/pre-tobias-grind.py
          else echo "hoppar: tools/pre-tobias-grind.py finns inte i denna branch"; fi

      - name: Referenschecksummor
        run: |
          if [ -f references/CHECKSUMS.sha256 ]; then
            cd references && sha256sum -c --quiet CHECKSUMS.sha256
          else echo "hoppar: references/CHECKSUMS.sha256 finns inte i denna branch"; fi

      - name: Webbygget
        run: |
          if [ -f tools/build.py ]; then python3 tools/build.py
          else echo "hoppar: tools/build.py finns inte i denna branch"; fi

      - name: Hästkanon-save migreras utan identitetsläckage
        run: |
          if [ -f tools/testa-hastkanon-save.mjs ]; then node tools/testa-hastkanon-save.mjs
          else echo "hoppar: tools/testa-hastkanon-save.mjs finns inte i denna branch"; fi

      - name: Studio-paketet ska gå att bygga
        run: |
          if [ -f tools/studio-paket.py ]; then python3 tools/studio-paket.py
          else echo "hoppar: tools/studio-paket.py finns inte i denna branch"; fi

      # FIRST_PLAYABLE_PREFLIGHT, pakethalvan (#162). Blockeraren Tobias
      # hittade fysiskt i Studio var att miljöpaketet presenterades som First
      # Playable: världen fanns men ingen gameplay, ingen spawn och ingen
      # dörrinteraktion. Den här grinden bygger placen ur default.project.json
      # och FÄLLER om någon del av First Playable saknas i den. Fail closed —
      # frånvaro av ett PASS är inte ett PASS.
      - name: First Playable-placen är komplett
        run: |
          if [ -f tools/kolla-place.py ]; then python3 tools/kolla-place.py
          else echo "hoppar: tools/kolla-place.py finns inte i denna branch"; fi

      # END_TO_END_PLAYABILITY_GATE (#162, ChatGPT-processreview 16:31).
      # Mäter en gångbar kedja spawn → entrédörr → in → gången vid Jacks
      # box, collision-aware med avatarens footprint över den FAKTISKT
      # byggda geometrin. Grinden finns för att de tre fel Tobias hittade
      # fysiskt alla var osynliga för grindar som mätte avsikt.
      - name: END_TO_END_PLAYABILITY_GATE — kedjan är gångbar
        run: |
          if [ -f roblox/tests/spelbarhet.spec.luau ]; then
            python3 roblox/tests/build.py tests/spelbarhet.spec.luau
            luau roblox/tests/.build/spelbarhet.spec.luau
          else echo "hoppar: spelbarhet.spec.luau finns inte i denna branch"; fi

      # END_TO_END_PLAYABILITY_GATE punkt 7-11 (#162). Gångbarhetsgrinden
      # ovan mäter att kedjan i VÄRLDEN går att gå. Den här mäter att DAGEN
      # går att spela: skötseln, nejen, uppsittningen mot en riktig Seat, en
      # ridbildruta, döden och respawnen, och att passet räknas exakt en
      # gång — allt genom tjänsterna mot HastRiggs rigg. Egen step trots att
      # kor.sh kör samma spec, av samma skäl som spelbarhetsgrinden: när den
      # här faller ska loggen säga VILKEN punkt i gaten som föll.
      - name: END_TO_END_PLAYABILITY_GATE — dagen går att spela igenom
        run: |
          if [ -f roblox/tests/integration.spec.luau ]; then
            python3 roblox/tests/build.py tests/integration.spec.luau
            luau roblox/tests/.build/integration.spec.luau
          else echo "hoppar: integration.spec.luau finns inte i denna branch"; fi

      # PRODUKTKRAV (#162): alla kanoniska UBRF-hästar ska vara ridbara,
      # genom EN datastyrd kedja. Två steg för de två halvorna av kravet:
      # rostergrinden rider varje individ i speldatan, och skannern fäller
      # om någon enskild häst fått en egen gren i runtimekoden.
      - name: Alla UBRF-hästar är ridbara — hela rostern
        run: |
          if [ -f roblox/tests/roster.spec.luau ]; then
            python3 roblox/tests/build.py tests/roster.spec.luau
            luau roblox/tests/.build/roster.spec.luau
          else echo "hoppar: roster.spec.luau finns inte i denna branch"; fi

      # LOKALISERING sv/en (#162). Tre steg, tre olika frågor:
      #   · Luau-specen: ritas ytorna FAKTISKT om på sv-se och en-us,
      #   · skannern: finns varje nyckel, och står svensk spelartext kvar,
      #   · webbgrinden: läser webben SAMMA katalog som Roblox.
      - name: Lokalisering — ytorna ritas om på sv-se och en-us
        run: |
          if [ -f roblox/tests/sprak.spec.luau ]; then
            python3 roblox/tests/build.py tests/sprak.spec.luau
            luau roblox/tests/.build/sprak.spec.luau
          else echo "hoppar: sprak.spec.luau finns inte i denna branch"; fi

      # Punkt 4 ur reviewen 18:27: ett engelskt svep över NEJ-vägarna.
      # sprak.spec mäter att ytorna ritas om; den här mäter att serverns
      # nekanden inte är svensk prosa — det var där prosan satt.
      - name: Lokalisering — engelskt svep över nej-vägarna
        run: |
          if [ -f roblox/tests/sprak-en.spec.luau ]; then
            python3 roblox/tests/build.py tests/sprak-en.spec.luau
            luau roblox/tests/.build/sprak-en.spec.luau
          else echo "hoppar: sprak-en.spec.luau finns inte i denna branch"; fi

      - name: Lokalisering — varje nyckel finns, ingen text utan nyckel
        run: |
          if [ -f tools/kolla-sprak.py ]; then python3 tools/kolla-sprak.py
          else echo "hoppar: tools/kolla-sprak.py finns inte i denna branch"; fi

      - name: En generisk häststack — inget hästid hårdkodat
        run: |
          if [ -f tools/kolla-generisk-hast.py ]; then python3 tools/kolla-generisk-hast.py
          else echo "hoppar: tools/kolla-generisk-hast.py finns inte i denna branch"; fi

      # Sökvägarna (#153 fix 2 / P3-5): verktygen läste repo-roten ur
      # `new URL(".", import.meta.url).pathname`, som ger PROCENTKODAD text.
      # En katalog som heter "UBRF häst" blev "UBRF%20h%C3%A4st" och varje
      # verktyg dog med ENOENT innan en mätning kördes. Auditen rapporterade
      # det som ett Windows-fel; det slår lika hårt här. Ingen webbläsare
      # behövs, så steget hör hemma i det här jobbet.
      - name: Sökvägarna — verktygen kör ur en katalog med mellanslag och ä
        run: |
          if [ -f tools/sokvagstest.mjs ]; then node tools/sokvagstest.mjs
          else echo "hoppar: tools/sokvagstest.mjs finns inte i denna branch"; fi

  dubbel-sanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Genererade filer får inte handredigeras
        run: |
          set -euo pipefail
          # Genererade Luau-filer bär en varningsrad. Om en PR ändrar en sådan
          # fil utan att också ändra sin generator är det en handredigering, och
          # då är sanningen dubbel igen — precis det som --kontrollera finns för.
          git fetch origin "${GITHUB_BASE_REF:-main}" --depth=1 || true
          bas="origin/${GITHUB_BASE_REF:-main}"
          git rev-parse --verify "$bas" >/dev/null 2>&1 || { echo "ingen bas att jämföra mot"; exit 0; }
          andrade=$(git diff --name-only "$bas"...HEAD || true)
          fel=0
          for genererad in roblox/game/UBRFSpelData.luau roblox/game/UBRFSkotsel.luau roblox/buildings/UBRFKomplex.luau roblox/src/shared/HorseCore/RidKanon.luau; do
            printf '%s\n' "$andrade" | grep -qx "$genererad" || continue
            case "$genererad" in
              roblox/game/UBRFSpelData.luau)      gen="tools/exportera-spel.js";;
              roblox/game/UBRFSkotsel.luau)       gen="tools/exportera-spel.js";;
              roblox/buildings/UBRFKomplex.luau) gen="tools/exportera-geometri.js";;
              roblox/src/shared/HorseCore/RidKanon.luau) gen="tools/exportera-ridkanon.mjs";;
            esac
            kalla=$(printf '%s\n' "$andrade" | grep -E '^(src/|tools/)' || true)
            if [ -z "$kalla" ]; then
              echo "FEL  $genererad ändrad utan någon ändring i src/ eller tools/ — genererad fil handredigerad?"
              echo "     generatorn är $gen"
              fel=1
            fi
          done
          [ "$fel" -eq 0 ] && echo "OK   inga handredigerade genererade filer"
          exit $fel

  # G02-A #82: ridkärnans regressionstest kör den KANONISKA ridmodellen i den
  # byggda sidan — gångartsband, övergångskontrakt, telemetri, live-kopplingen
  # och volten mätt som ridd bana. Utan det här jobbet kan telemetrin,
  # uppsittningen eller styrningen gå sönder medan CI fortsätter vara grön.
  #
  # Egen job därför att det är det enda i G02-A som behöver en webbläsare, och
  # en Chromium-installation ska inte sinka de övriga grindarna.
  #
  # NOT: PR #85 lägger ett `gangbarhet`-job i samma fil, före `dubbel-sanning`.
  # Det här ligger sist med flit, så att de två PR:erna inte krockar textuellt
  # i workflowen.
  ridning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright + Chromium
        run: |
          set -euo pipefail
          if [ -f tools/ridtest.mjs ]; then
            npm install --no-save --no-package-lock playwright@1.49.1
            npx playwright install --with-deps chromium
          else echo "hoppar: tools/ridtest.mjs finns inte i denna branch"; fi

      - name: Webbygget
        run: |
          if [ -f tools/build.py ]; then python3 tools/build.py
          else echo "hoppar: tools/build.py finns inte i denna branch"; fi

      # Paritetshalvan av lokaliseringen: läser webben SAMMA katalog som
      # Roblox, nyckel för nyckel och text för text? Ligger i webbjobbet
      # eftersom den mäter dist/ridskolan.html, inte bara källan.
      - name: Lokalisering — webben läser samma katalog som Roblox
        run: |
          if [ -f tools/sprakgrind.mjs ]; then node tools/sprakgrind.mjs
          else echo "hoppar: tools/sprakgrind.mjs finns inte i denna branch"; fi

      - name: Ridkärnan — Gate 01-värden, telemetri, live-koppling och volten
        run: |
          if [ -f tools/ridtest.mjs ]; then node tools/ridtest.mjs
          else echo "hoppar: tools/ridtest.mjs finns inte i denna branch"; fi

      # Gården: de fyra blockerarna ur Tobias produkttest 2026-09-06 —
      # haggrinden, hästens startplats, stalldörren och tystnaden. Går med
      # spelets riktiga kollision, inte med punktprov mot datan.
      - name: Gården — grind, startplats, stalldörr och ljud
        run: |
          if [ -f tools/gardtest.mjs ]; then node tools/gardtest.mjs
          else echo "hoppar: tools/gardtest.mjs finns inte i denna branch"; fi

      # Uppdraget: objective/navigation-kedjan och att uppsittningen går
      # att NÅ genom hela produktionsvägen, gående, med E-interaktioner.
      - name: Uppdraget — vad, var, hur — och uppsittningen hela vägen
        run: |
          if [ -f tools/uppdragstest.mjs ]; then node tools/uppdragstest.mjs
          else echo "hoppar: tools/uppdragstest.mjs finns inte i denna branch"; fi

      # Inputsemantiken (PO-tillägg #151): att hjälperna SLÄPPS när spelaren
      # inte trycker. Kör riktiga tangent- och pekhändelser i telefon, iPad
      # landscape och skrivbord. Fångade ett verkligt fel: focus loss lämnade
      # skänkeln på, så hästen gick vidare medan spelaren var i en annan app.
      - name: Inputsemantik — focus loss, dold flik, spak och paneler
        run: |
          if [ -f tools/inputsemantiktest.mjs ]; then node tools/inputsemantiktest.mjs
          else echo "hoppar: tools/inputsemantiktest.mjs finns inte i denna branch"; fi

      # Välfärden (#153 fix 1): en häst som vilar för en skada får aldrig
      # tilldelas, och en ritt får aldrig radera skadan. Poolen föll förut
      # tillbaka på den OFILTRERADE listan när alla gruppens hästar vilade
      # och delade alltså ut precis de skadade hästar filtret plockat bort;
      # `delete ny.skada` gjorde sedan hästen frisk av att ha arbetat.
      - name: Välfärden — skadad häst tilldelas inte och skadan består
        run: |
          if [ -f tools/valfardstest.mjs ]; then node tools/valfardstest.mjs
          else echo "hoppar: tools/valfardstest.mjs finns inte i denna branch"; fi

      # Uppdragsetiketten (#153 fix 4): vägvisarens pin är centrerad, så
      # etiketten sticker ut halva sin bredd åt vardera hållet. Klampningen
      # höll bara ANKARET innanför 44 px — "Prata med ridläraren · 18 m"
      # (231 px) hamnade 72 px utanför kanten på alla fyra vyer.
      - name: Uppdragsetiketten — hela labeln innanför skärmen
        run: |
          if [ -f tools/uppdragsetikett-test.mjs ]; then node tools/uppdragsetikett-test.mjs
          else echo "hoppar: tools/uppdragsetikett-test.mjs finns inte i denna branch"; fi

      # Replaypanelen (#153 fix 4 / QA-2): rutnätet låg som inline-stil och
      # kunde därför inte tas över av en media query. Kolumnerna låg kvar ner
      # till 320 px, där ritt-canvasen — funktionens hela poäng — blev 122 px.
      - name: Replaypanelen — en kolumn och läsbar canvas på små skärmar
        run: |
          if [ -f tools/replaylayouttest.mjs ]; then node tools/replaylayouttest.mjs
          else echo "hoppar: tools/replaylayouttest.mjs finns inte i denna branch"; fi

      # Karaktärsskaparen (#153 fix 4 / QA-3): mobil.js sätter golvet 44 px
      # för .btn och motiverar det själv — "fingret behöver 44 px, inte 26".
      # Skaparens .skapChip/.skapFlik är andra klasser och gick fria: 26 resp
      # 31 px på den allra första skärmen en spelare rör vid på en iPad.
      - name: Karaktärsskaparen — träffytorna når 44 px på pekskärm
        run: |
          if [ -f tools/skapartest.mjs ]; then node tools/skapartest.mjs
          else echo "hoppar: tools/skapartest.mjs finns inte i denna branch"; fi

      # Röstgrinden (#161): Tobias produktbeslut 2026-09-10 — ingen röst får
      # agera ridlärare. `ljudRost()` läste lärarens repliker med webbläsarens
      # svenska talsyntes; funktionen, flaggan och båda anropsställena är
      # borta. Grinden finns för att borttagningen ska HÅLLA: den strippar
      # kommentarer (så en förklaring av varför rösten är borta inte fäller),
      # mäter både src/ och den byggda webben, kräver att den SKRIVNA
      # lärartexten och det icke-verbala ljudet står kvar, och provar sig
      # själv mot tre syntetiserade återinföranden.
      - name: Röstgrinden — skriven lärartext, ingen uppläsning
        run: |
          if [ -f tools/rostgrind.mjs ]; then node tools/rostgrind.mjs
          else echo "hoppar: tools/rostgrind.mjs finns inte i denna branch"; fi

      # Läktaren (P0 #81/#114): gångtestet visar att en VÄG finns, det här
      # mäter vad spelaren SER — att kroppen ritas på golvnivån hon står på,
      # att ingen debugmarkering ligger i produktvyn och att ytan under
      # fötterna inte tonas bort. Grön CI på vägen räckte inte förra gången.
      - name: Läktaren — kroppen följer golvet, ingen debuggeometri
        run: |
          if [ -f tools/laktartest.mjs ]; then node tools/laktartest.mjs
          else echo "hoppar: tools/laktartest.mjs finns inte i denna branch"; fi
