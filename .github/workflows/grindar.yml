name: Grindar

# Gaterna fanns redan i repot — de var bara frivilliga. Den här workflowen gör
# Lager B i docs/DELIVERY-PROTOCOL.md automatiskt och obligatoriskt: ingen kan
# längre säga "testerna är gröna" utan att exitkoden finns här att läsa.
#
# G8: INGET STEG ÄR LÄNGRE VILLKORAT. Varje kontroll var förut inlindad i
# `if [ -f ... ]; then ... else echo hoppar; fi`, med motiveringen att olika
# brancher har olika många kontroller. Den motiveringen gör grön CI
# meningslös: att radera ett obligatoriskt skript fick steget att passera
# utan att testa någonting, och inget i loggen skilde det från ett riktigt
# PASS. Saknad indata faller nu med exitkod och en rad som namnger sökvägen
# och steget. tools/testa-grindar-workflow.py bevakar att det förblir så.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  grindar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hämta luau
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o -q /tmp/luau.zip -d /tmp/luau
          sudo install -m 0755 /tmp/luau/luau /usr/local/bin/luau
          luau --help >/dev/null && echo "luau installerad"

      # G8 (#264): FORHANDSKOLL. Stegen nedan fäller var och en på sin egen
      # saknade indata, men GitHub stoppar jobbet vid det första röda steget
      # — saknas tre kontroller upptäcks de en CI-körning i taget. Det här
      # steget lägger ingen ny sanning till: det läser samma `test -f`-rader
      # ur den här filen och namnger ALLA som saknas, på en gång.
      - name: Förhandskoll — finns varje obligatorisk indata?
        run: |
          set -euo pipefail
          test -f tools/testa-grindar-workflow.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/testa-grindar-workflow.py (steget 'Förhandskoll — finns varje obligatorisk indata?')" >&2; exit 1; }
          python3 -m pip install --quiet pyyaml
          python3 tools/testa-grindar-workflow.py --forhandskoll

      - name: Materialkontroll — ogiltigt Enum.Material fäller Studio
        run: |
          set -euo pipefail
          test -f tools/kolla-material.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-material.py (steget 'Materialkontroll — ogiltigt Enum.Material fäller Studio')" >&2; exit 1; }
          python3 tools/kolla-material.py

      # Build-identiteten (#171). Den läsande Studio-auditen fann att
      # ReplicatedStorage.UBRFBuild var handplacerad och pekade på en head 53
      # commits gammal medan preflightens punkt 9 lyste grönt. En place kan
      # inte räkna om hashen över sin egen källkod, så FÄRSKHETEN måste mätas
      # här: identiteten i repot mot filerna default.project.json mappar.
      # Punkt 9a–9d i preflighten mäter form och ursprung; den här raden
      # mäter att innehållet stämmer.
      - name: Build-identitet aktuell — UBRFBuild mot mappade källor
        run: |
          set -euo pipefail
          test -f tools/bygg-identitet.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/bygg-identitet.py (steget 'Build-identitet aktuell — UBRFBuild mot mappade källor')" >&2; exit 1; }
          python3 tools/bygg-identitet.py --kontrollera

      - name: Speldata i synk — src/spel/ mot Roblox-modulerna
        run: |
          set -euo pipefail
          test -f tools/exportera-spel.js || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/exportera-spel.js (steget 'Speldata i synk — src/spel/ mot Roblox-modulerna')" >&2; exit 1; }
          node tools/exportera-spel.js --kontrollera

      - name: Ridkanon i synk — src/model.js mot RidKanon.luau
        run: |
          set -euo pipefail
          test -f tools/exportera-ridkanon.mjs || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/exportera-ridkanon.mjs (steget 'Ridkanon i synk — src/model.js mot RidKanon.luau')" >&2; exit 1; }
          node tools/exportera-ridkanon.mjs --kontrollera

      - name: Geometri i synk — src/site.js mot UBRFKomplex.luau
        run: |
          set -euo pipefail
          test -f tools/exportera-geometri.js || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/exportera-geometri.js (steget 'Geometri i synk — src/site.js mot UBRFKomplex.luau')" >&2; exit 1; }
          node tools/exportera-geometri.js --kontrollera

      - name: Dörrfärgsparitet webb/Roblox
        run: |
          set -euo pipefail
          test -f tools/kolla-dorrfarg.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-dorrfarg.py (steget 'Dörrfärgsparitet webb/Roblox')" >&2; exit 1; }
          python3 tools/kolla-dorrfarg.py

      # Första dagens häst (#162 blockerare 3): produktregeln "ny spelare
      # rider Jack" står numera på två ställen — src/scenes.js och
      # roblox/game/Stallet.luau. Grinden ser till att de två aldrig blir
      # två SANNINGAR, och att hästen finns i den delade datan.
      - name: Första dagens häst — samma på webb och Roblox
        run: |
          set -euo pipefail
          test -f tools/kolla-forstadagen.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-forstadagen.py (steget 'Första dagens häst — samma på webb och Roblox')" >&2; exit 1; }
          python3 tools/kolla-forstadagen.py

      - name: Rojo-projektkontroll
        run: |
          set -euo pipefail
          test -f tools/kolla-rojo.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-rojo.py (steget 'Rojo-projektkontroll')" >&2; exit 1; }
          python3 tools/kolla-rojo.py

      - name: VERIFIED kräver granskad nyckelbild
        run: |
          set -euo pipefail
          test -f tools/kolla-nyckelbilder.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-nyckelbilder.py (steget 'VERIFIED kräver granskad nyckelbild')" >&2; exit 1; }
          python3 tools/kolla-nyckelbilder.py

      - name: Luau-specarna
        run: |
          set -euo pipefail
          test -f roblox/tests/kor.sh || { echo "OBLIGATORISK KONTROLL SAKNAS: roblox/tests/kor.sh (steget 'Luau-specarna')" >&2; exit 1; }
          bash roblox/tests/kor.sh

      # Handigheten, webbens halva. roblox/tests/handighet.spec.luau mäter
      # Roblox i steget ovan; det här mäter webben mot SAMMA ankare ur
      # SITEPLAN. Båda behövs: en spegling överlever varje koordinatprov
      # och varje paritetsprov — är båda ytorna speglade likadant är de
      # överens om att ha fel. Det var precis så Roblox kunde vara
      # spegelvänt med alla grindar gröna.
      - name: Handigheten på webben
        run: |
          set -euo pipefail
          test -f tools/handighetsgrind.mjs || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/handighetsgrind.mjs (steget 'Handigheten på webben')" >&2; exit 1; }
          node tools/handighetsgrind.mjs

      # PRE_TOBIAS_FIRST_PLAYABLE_GATE (processändringen på #162, 05:42).
      # Samlingsgrinden kör undergrindarna en gång till i ett svep och
      # producerar release evidence bundle + WORLD_MANIFEST. Den ligger
      # HÄR, efter specarna, därför att den ska vara det sista svaret på
      # frågan "får Tobias en ny .rbxlx?" — och den är fail closed.
      - name: PRE_TOBIAS_FIRST_PLAYABLE_GATE
        run: |
          set -euo pipefail
          test -f tools/pre-tobias-grind.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/pre-tobias-grind.py (steget 'PRE_TOBIAS_FIRST_PLAYABLE_GATE')" >&2; exit 1; }
          python3 tools/pre-tobias-grind.py

      - name: Referenschecksummor
        run: |
          set -euo pipefail
          test -f references/CHECKSUMS.sha256 || { echo "OBLIGATORISK KONTROLL SAKNAS: references/CHECKSUMS.sha256 (steget 'Referenschecksummor')" >&2; exit 1; }
          cd references && sha256sum -c --quiet CHECKSUMS.sha256

      - name: Webbygget
        run: |
          set -euo pipefail
          test -f tools/build.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/build.py (steget 'Webbygget')" >&2; exit 1; }
          python3 tools/build.py

      - name: Hästkanon-save migreras utan identitetsläckage
        run: |
          set -euo pipefail
          test -f tools/testa-hastkanon-save.mjs || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/testa-hastkanon-save.mjs (steget 'Hästkanon-save migreras utan identitetsläckage')" >&2; exit 1; }
          node tools/testa-hastkanon-save.mjs

      - name: Studio-paketet ska gå att bygga
        run: |
          set -euo pipefail
          test -f tools/studio-paket.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/studio-paket.py (steget 'Studio-paketet ska gå att bygga')" >&2; exit 1; }
          python3 tools/studio-paket.py

      # FIRST_PLAYABLE_PREFLIGHT, pakethalvan (#162). Blockeraren Tobias
      # hittade fysiskt i Studio var att miljöpaketet presenterades som First
      # Playable: världen fanns men ingen gameplay, ingen spawn och ingen
      # dörrinteraktion. Den här grinden bygger placen ur default.project.json
      # och FÄLLER om någon del av First Playable saknas i den. Fail closed —
      # frånvaro av ett PASS är inte ett PASS.
      - name: First Playable-placen är komplett
        run: |
          set -euo pipefail
          test -f tools/kolla-place.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-place.py (steget 'First Playable-placen är komplett')" >&2; exit 1; }
          python3 tools/kolla-place.py

      # EVIDENS_PLACE (#219). Den bevarade First Playable-placen från #218 ska
      # vara byte för byte den Tobias accepterade, och .gitattributes-regeln
      # som hindrar radslutsnormalisering ska fortfarande gälla. Det här
      # steget var redan fail closed när resten av filen inte var det
      # (review 01:43): en bevarandegrind ska falla, inte hoppas över, om
      # kontrollskriptet försvinner. G8 behöll kommandot oförändrat och la
      # bara till samma namngivna diagnostik som övriga steg nu har.
      - name: Bevarad First Playable-place är oförändrad
        run: |
          set -euo pipefail
          test -f tools/kolla-evidens-place.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-evidens-place.py (steget 'Bevarad First Playable-place är oförändrad')" >&2; exit 1; }
          python3 tools/kolla-evidens-place.py

      # END_TO_END_PLAYABILITY_GATE (#162, ChatGPT-processreview 16:31).
      # Mäter en gångbar kedja spawn → entrédörr → in → gången vid Jacks
      # box, collision-aware med avatarens footprint över den FAKTISKT
      # byggda geometrin. Grinden finns för att de tre fel Tobias hittade
      # fysiskt alla var osynliga för grindar som mätte avsikt.
      - name: END_TO_END_PLAYABILITY_GATE — kedjan är gångbar
        run: |
          set -euo pipefail
          test -f roblox/tests/spelbarhet.spec.luau || { echo "OBLIGATORISK KONTROLL SAKNAS: roblox/tests/spelbarhet.spec.luau (steget 'END_TO_END_PLAYABILITY_GATE — kedjan är gångbar')" >&2; exit 1; }
          python3 roblox/tests/build.py tests/spelbarhet.spec.luau
          luau roblox/tests/.build/spelbarhet.spec.luau

      # END_TO_END_PLAYABILITY_GATE punkt 7-11 (#162). Gångbarhetsgrinden
      # ovan mäter att kedjan i VÄRLDEN går att gå. Den här mäter att DAGEN
      # går att spela: skötseln, nejen, uppsittningen mot en riktig Seat, en
      # ridbildruta, döden och respawnen, och att passet räknas exakt en
      # gång — allt genom tjänsterna mot HastRiggs rigg. Egen step trots att
      # kor.sh kör samma spec, av samma skäl som spelbarhetsgrinden: när den
      # här faller ska loggen säga VILKEN punkt i gaten som föll.
      - name: END_TO_END_PLAYABILITY_GATE — dagen går att spela igenom
        run: |
          set -euo pipefail
          test -f roblox/tests/integration.spec.luau || { echo "OBLIGATORISK KONTROLL SAKNAS: roblox/tests/integration.spec.luau (steget 'END_TO_END_PLAYABILITY_GATE — dagen går att spela igenom')" >&2; exit 1; }
          python3 roblox/tests/build.py tests/integration.spec.luau
          luau roblox/tests/.build/integration.spec.luau

      # PRODUKTKRAV (#162): alla kanoniska UBRF-hästar ska vara ridbara,
      # genom EN datastyrd kedja. Två steg för de två halvorna av kravet:
      # rostergrinden rider varje individ i speldatan, och skannern fäller
      # om någon enskild häst fått en egen gren i runtimekoden.
      - name: Alla UBRF-hästar är ridbara — hela rostern
        run: |
          set -euo pipefail
          test -f roblox/tests/roster.spec.luau || { echo "OBLIGATORISK KONTROLL SAKNAS: roblox/tests/roster.spec.luau (steget 'Alla UBRF-hästar är ridbara — hela rostern')" >&2; exit 1; }
          python3 roblox/tests/build.py tests/roster.spec.luau
          luau roblox/tests/.build/roster.spec.luau

      # LOKALISERING sv/en (#162). Tre steg, tre olika frågor:
      #   · Luau-specen: ritas ytorna FAKTISKT om på sv-se och en-us,
      #   · skannern: finns varje nyckel, och står svensk spelartext kvar,
      #   · webbgrinden: läser webben SAMMA katalog som Roblox.
      - name: Lokalisering — ytorna ritas om på sv-se och en-us
        run: |
          set -euo pipefail
          test -f roblox/tests/sprak.spec.luau || { echo "OBLIGATORISK KONTROLL SAKNAS: roblox/tests/sprak.spec.luau (steget 'Lokalisering — ytorna ritas om på sv-se och en-us')" >&2; exit 1; }
          python3 roblox/tests/build.py tests/sprak.spec.luau
          luau roblox/tests/.build/sprak.spec.luau

      # Punkt 4 ur reviewen 18:27: ett engelskt svep över NEJ-vägarna.
      # sprak.spec mäter att ytorna ritas om; den här mäter att serverns
      # nekanden inte är svensk prosa — det var där prosan satt.
      - name: Lokalisering — engelskt svep över nej-vägarna
        run: |
          set -euo pipefail
          test -f roblox/tests/sprak-en.spec.luau || { echo "OBLIGATORISK KONTROLL SAKNAS: roblox/tests/sprak-en.spec.luau (steget 'Lokalisering — engelskt svep över nej-vägarna')" >&2; exit 1; }
          python3 roblox/tests/build.py tests/sprak-en.spec.luau
          luau roblox/tests/.build/sprak-en.spec.luau

      - name: Lokalisering — varje nyckel finns, ingen text utan nyckel
        run: |
          set -euo pipefail
          test -f tools/kolla-sprak.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-sprak.py (steget 'Lokalisering — varje nyckel finns, ingen text utan nyckel')" >&2; exit 1; }
          python3 tools/kolla-sprak.py

      - name: En generisk häststack — inget hästid hårdkodat
        run: |
          set -euo pipefail
          test -f tools/kolla-generisk-hast.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/kolla-generisk-hast.py (steget 'En generisk häststack — inget hästid hårdkodat')" >&2; exit 1; }
          python3 tools/kolla-generisk-hast.py

      # …och grinden själv provas i BÅDA riktningarna (#259 Gate 0). Den
      # var grön här och röd på Windows, och ingen av färgerna var sann:
      # undantagslistans nycklar har `/` medan `relative_to` ger `\` på
      # Windows, så uppslaget matchade aldrig. Ett undantag som inte
      # träffar något ser likadant ut som ett som inte behövdes — därför
      # faller grinden numera på det, och därför provas den härifrån.
      - name: Grindprovet för generisk häststack
        run: |
          set -euo pipefail
          test -f tools/testa-kolla-generisk-hast.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/testa-kolla-generisk-hast.py (steget 'Grindprovet för generisk häststack')" >&2; exit 1; }
          python3 tools/testa-kolla-generisk-hast.py

      # Sökvägarna (#153 fix 2 / P3-5): verktygen läste repo-roten ur
      # `new URL(".", import.meta.url).pathname`, som ger PROCENTKODAD text.
      # En katalog som heter "UBRF häst" blev "UBRF%20h%C3%A4st" och varje
      # verktyg dog med ENOENT innan en mätning kördes. Auditen rapporterade
      # det som ett Windows-fel; det slår lika hårt här. Ingen webbläsare
      # behövs, så steget hör hemma i det här jobbet.
      - name: Sökvägarna — verktygen kör ur en katalog med mellanslag och ä
        run: |
          set -euo pipefail
          test -f tools/sokvagstest.mjs || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/sokvagstest.mjs (steget 'Sökvägarna — verktygen kör ur en katalog med mellanslag och ä')" >&2; exit 1; }
          node tools/sokvagstest.mjs

      # G8 (#264): grinden som vaktar grindarna. Kontrollerna ovan var förut
      # villkorade på att sina filer fanns, så en raderad kontroll gav ett
      # grönt steg som inte testat någonting. Provet läser den här filen med
      # en riktig YAML-parser, håller en fast inventarielista över de
      # obligatoriska anropen och KÖR run-blocken härifrån i isolerade
      # fixturer — både att saknad indata fäller och att ett trasigt bygge
      # inte maskeras av en gammal genererad fil. Ovillkorligt, självklart.
      - name: Grindarna är fail closed
        run: |
          set -euo pipefail
          test -f tools/testa-grindar-workflow.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/testa-grindar-workflow.py (steget 'Grindarna är fail closed')" >&2; exit 1; }
          python3 -m pip install --quiet pyyaml
          python3 tools/testa-grindar-workflow.py

  dubbel-sanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Genererade filer får inte handredigeras
        run: |
          set -euo pipefail
          # Genererade Luau-filer bär en varningsrad. Om en PR ändrar en sådan
          # fil utan att också ändra sin generator är det en handredigering, och
          # då är sanningen dubbel igen — precis det som --kontrollera finns för.
          git fetch origin "${GITHUB_BASE_REF:-main}" --depth=1 || true
          bas="origin/${GITHUB_BASE_REF:-main}"
          git rev-parse --verify "$bas" >/dev/null 2>&1 || { echo "ingen bas att jämföra mot"; exit 0; }
          andrade=$(git diff --name-only "$bas"...HEAD || true)
          fel=0
          for genererad in roblox/game/UBRFSpelData.luau roblox/game/UBRFSkotsel.luau roblox/buildings/UBRFKomplex.luau roblox/src/shared/HorseCore/RidKanon.luau; do
            printf '%s\n' "$andrade" | grep -qx "$genererad" || continue
            case "$genererad" in
              roblox/game/UBRFSpelData.luau)      gen="tools/exportera-spel.js";;
              roblox/game/UBRFSkotsel.luau)       gen="tools/exportera-spel.js";;
              roblox/buildings/UBRFKomplex.luau) gen="tools/exportera-geometri.js";;
              roblox/src/shared/HorseCore/RidKanon.luau) gen="tools/exportera-ridkanon.mjs";;
            esac
            kalla=$(printf '%s\n' "$andrade" | grep -E '^(src/|tools/)' || true)
            if [ -z "$kalla" ]; then
              echo "FEL  $genererad ändrad utan någon ändring i src/ eller tools/ — genererad fil handredigerad?"
              echo "     generatorn är $gen"
              fel=1
            fi
          done
          [ "$fel" -eq 0 ] && echo "OK   inga handredigerade genererade filer"
          exit $fel

  # G02-A #82: ridkärnans regressionstest kör den KANONISKA ridmodellen i den
  # byggda sidan — gångartsband, övergångskontrakt, telemetri, live-kopplingen
  # och volten mätt som ridd bana. Utan det här jobbet kan telemetrin,
  # uppsittningen eller styrningen gå sönder medan CI fortsätter vara grön.
  #
  # Egen job därför att det är det enda i G02-A som behöver en webbläsare, och
  # en Chromium-installation ska inte sinka de övriga grindarna.
  #
  # NOT: PR #85 lägger ett `gangbarhet`-job i samma fil, före `dubbel-sanning`.
  # Det här ligger sist med flit, så att de två PR:erna inte krockar textuellt
  # i workflowen.
  ridning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright + Chromium
        run: |
          set -euo pipefail
          test -f tools/ridtest.mjs || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/ridtest.mjs (steget 'Playwright + Chromium')" >&2; exit 1; }
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Webbygget
        run: |
          set -euo pipefail
          test -f tools/build.py || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/build.py (steget 'Webbygget')" >&2; exit 1; }
          python3 tools/build.py

      # Paritetshalvan av lokaliseringen: läser webben SAMMA katalog som
      # Roblox, nyckel för nyckel och text för text? Ligger i webbjobbet
      # eftersom den mäter dist/ridskolan.html, inte bara källan.
      - name: Lokalisering — webben läser samma katalog som Roblox
        run: |
          set -euo pipefail
          test -f tools/sprakgrind.mjs || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/sprakgrind.mjs (steget 'Lokalisering — webben läser samma katalog som Roblox')" >&2; exit 1; }
          node tools/sprakgrind.mjs

      - name: Ridkärnan — Gate 01-värden, telemetri, live-koppling och volten
        run: |
          set -euo pipefail
          test -f tools/ridtest.mjs || { echo "OBLIGATORISK KONTROLL SAKNAS: tools/ridtest.mjs (steget 'Ridkärnan — Gate 01-värden, telemetri, live-koppling och volten')" >&2; exit 1; }
