name: P0 del 2 — applicera inputfix
on:
  push:
    branches: [chatgpt/p0-input-impulse-part2-20260908]
    paths: [.github/workflows/p0-part2-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'P0 del 2: applicera avgränsad och källlåst inputfix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kontrollera exakt källbas
        run: |
          git diff --exit-code fbccdfc7a201c0418ff140d6aea708c596dd582e HEAD -- src/game.js src/world.js src/scenes.js index.html
          git diff --exit-code 594fbcf6e36e910e79beafab2033c01fa8177b3f HEAD -- src/input-impulse.js
      - name: Applicera endast godkända ersättningar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def change(path,pairs):
              p=Path(path);s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if s.count(old)!=1:raise SystemExit(f'Expected exactly one match in {path}: {old[:80]!r}; found {s.count(old)}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          change('index.html',[(
              '<script src="src/world.js"></script>',
              '<script src="src/input-impulse.js"></script>\n<script src="src/world.js"></script>')])
          change('src/game.js',[(
              '  if(e.repeat)return; IN.ned[e.code]=true;',
              '''  if(e.repeat)return;
            const wasDown=!!IN.ned[e.code];
            IN.ned[e.code]=true;
            /* E är en engångshandling i gångläget. Bevara den tills spelet samplar,
               men skapa aldrig en impuls från autorepeat, en overlay eller ridning. */
            if(e.code==="KeyE"&&!wasDown&&
               (G.scen==="gard"||G.scen==="stallinne"||G.scen==="ridhusinne")&&
               !overlayUppe())InputImpulse.press("KeyE",G.scen);''')])
          change('src/world.js',[(
              '''  const e=!!IN.ned.KeyE;
            if(e&&!VD.ePrev&&bast&&!overlayUppe()) bast.gor();
            VD.ePrev=e;''',
              '''  /* Konsumera även om inget giltigt mål finns: ett gammalt tryck får
               aldrig aktivera en dörr som spelaren närmar sig senare. */
            const e=InputImpulse.consume("KeyE",G.scen);
            if(e&&bast&&!overlayUppe()) bast.gor();
            VD.ePrev=!!IN.ned.KeyE;'''),(
              '''function gaTill(scen,spawn){
            G.scen=scen;''',
              '''function gaTill(scen,spawn){
            InputImpulse.clear("KeyE");
            G.scen=scen;'''),(
              '''function startaVandring(){
            if(typeof ridSittAv''',
              '''function startaVandring(){
            InputImpulse.clear("KeyE");
            if(typeof ridSittAv''')])
          change('src/scenes.js',[(
              'function overlay(on,html){ov.classList.toggle("hide",!on);if(html!==undefined)sheet.innerHTML=html;}',
              'function overlay(on,html){if(on)InputImpulse.clear("KeyE");ov.classList.toggle("hide",!on);if(html!==undefined)sheet.innerHTML=html;}')])
          p=Path('.github/workflows/p0-input-impulse.yml')
          s=p.read_text()
          old='      - run: node tools/input-impulse-test.mjs'
          assert s.count(old)==1
          s=s.replace(old,old+'\n      - run: node tools/input-interaction-test.mjs\n      - run: node tools/control-feel-test.mjs')
          p.write_text(s)
          PY
      - name: Smala regressioner och bygg
        run: |
          node tools/input-impulse-test.mjs
          node tools/input-interaction-test.mjs
          node tools/control-feel-test.mjs
          node --check src/game.js
          node --check src/world.js
          node --check src/scenes.js
          python3 tools/build.py
      - name: Publicera verifierad fix utan temporärt workflow
        run: |
          git config user.name 'UBRF QA'
          git config user.email 'ubrf-qa@users.noreply.github.com'
          git rm .github/workflows/p0-part2-apply.yml
          git add index.html src/game.js src/world.js src/scenes.js .github/workflows/p0-input-impulse.yml
          git diff --cached --stat
          git diff --cached --exit-code -- src/riding roblox src/mobil.js src/model.js
          git commit -m 'P0 del 2: konsumera E-impuls i gångläget'
          git push origin HEAD:chatgpt/p0-input-impulse-part2-20260908
