name: P0 del 2 - applicera inputfix
on:
  push:
    branches:
      - chatgpt/p0-input-impulse-part2-20260908
    paths:
      - .github/workflows/p0-part2-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kontrollera exakt kallbas
        run: |
          git diff --exit-code fbccdfc7a201c0418ff140d6aea708c596dd582e HEAD -- src/game.js src/world.js src/scenes.js index.html
          git diff --exit-code 594fbcf6e36e910e79beafab2033c01fa8177b3f HEAD -- src/input-impulse.js
      - name: Applicera och verifiera
        run: |
          python3 tools/p0-part2-apply.py
          node tools/input-impulse-test.mjs
          node tools/input-interaction-test.mjs
          node tools/control-feel-test.mjs
          node --check src/game.js
          node --check src/world.js
          node --check src/scenes.js
          python3 tools/build.py
      - name: Publicera endast spelkod
        run: |
          git config user.name 'UBRF QA'
          git config user.email 'ubrf-qa@users.noreply.github.com'
          git restore .github/workflows/p0-input-impulse.yml
          git add index.html src/game.js src/world.js src/scenes.js
          git diff --cached --stat
          git diff --cached --exit-code -- src/riding roblox src/mobil.js src/model.js
          git commit -m 'P0 del 2: konsumera E-impuls i ganglaget'
          git push origin HEAD:chatgpt/p0-input-impulse-part2-20260908
