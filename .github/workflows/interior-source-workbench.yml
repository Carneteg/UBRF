name: Interior source workbench
on:
  push:
    branches: [chatgpt/interior-fidelity-v1]
    paths:
      - '.github/workflows/interior-source-workbench.yml'
      - 'tools/interior-source-workbench.mjs'
      - 'tools/interior-fidelity.patch.br.b64'
permissions:
  contents: write
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SHA-256-verified local implementation and remove temporary transfer files
        run: node tools/interior-source-workbench.mjs
