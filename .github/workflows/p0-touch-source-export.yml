name: P0 — låst källsnapshot för touch-QA
on:
  push:
    branches: [chatgpt/p0-touch-repair-20260908]
    paths: [.github/workflows/p0-touch-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Paketera exakt låst källversion
        run: |
          mkdir -p /tmp/ubrf-p0-source
          git fetch --no-tags --depth=1 origin 87cad7187468216677707bd960c3ad23313b99f1
          git archive --format=tar.gz -o /tmp/ubrf-p0-source/p0.tar.gz 87cad7187468216677707bd960c3ad23313b99f1 src tools index.html package.json package-lock.json docs .github scripts references/data AGENTS.md CLAUDE.md README.md ROADMAP.md
          printf '%s\n' 'P0=87cad7187468216677707bd960c3ad23313b99f1' > /tmp/ubrf-p0-source/MANIFEST.txt
          sha256sum /tmp/ubrf-p0-source/p0.tar.gz > /tmp/ubrf-p0-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: p0-touch-pinned-sources-${{ github.sha }}
          path: /tmp/ubrf-p0-source/
          retention-days: 7
