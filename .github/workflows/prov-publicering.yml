name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# ARMERAD for M/N (order 5757339608). AVVAPNAS DIREKT EFTERAT.
#
# Arm L (run 35574514273) gav 200: Rojos innehall i VAR serialisering,
# med alla sju kanda skillnader pa en gang, gick igenom. Mangden ar
# tomd bade var for sig och gemensamt.
#
# EFTERANALYSEN hittade da den faktiska skillnaden. L och var artefakt
# har IDENTISKA radmultimangder — noll skiljande rader nar ordningen
# sorteras bort — och skiljer sig pa exakt EN BYTE:
#
#   Rojo och L (200):  ...</roblox>       ingen avslutande radbrytning
#   var        (400):  ...</roblox>\n     AVSLUTANDE RADBRYTNING
#
# tools/bygg-place.py:245 avslutar dokumentet med en radbrytning.
#
# KORRELATIONEN AR TOTAL over alla sjutton matningar: varje fil utan
# avslutande radbrytning accepterades, varje fil med avvisades. Den
# forklarar ocksa varfor bisektionens bas var ogiltig — den kom ur min
# egen generator och slutade likadant. «Invalid Content stream» ar
# dessutom precis felet man vantar sig for skrapbytes EFTER
# dokumentelementet, snarare an for nagot inuti det.
#
#   M  var fil  - sista radbrytningen  -> 200 bekraftar
#   N  Rojos fil + en radbrytning      -> 400 bekraftar at andra hallet

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rojo 7.7.0
        run: |
          curl -sSL -o /tmp/rojo.zip             https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          sudo install -m 0755 /tmp/rojo/rojo /usr/local/bin/rojo
          rojo --version

      - name: Bygg kallartefakterna
        env:
          UBRF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "head: $UBRF_HEAD_SHA"
          rojo build roblox/default.project.json --output /tmp/rojo-kall.rbxlx
          python3 tools/bygg-place.py --ut /tmp/var-kall.rbxlx --sha "$UBRF_HEAD_SHA"
          for f in /tmp/rojo-kall.rbxlx /tmp/var-kall.rbxlx; do
            echo "$f  $(stat -c%s "$f") byte  $(sha256sum "$f" | cut -d' ' -f1)"
            echo "  sista byten: $(tail -c 14 "$f" | xxd -p)"
          done

      # Verktyget vagrar rora nagot annat an sista byten: langden maste
      # skilja exakt 1, skillnaden maste ligga SIST, och den omvanda
      # atgarden maste ge tillbaka infilens exakta bytes.
      - name: M och N — en byte, med bevis
        run: |
          echo "=== M: var fil MINUS sista radbrytningen (ska laga) ==="
          python3 tools/sista-byten.py --in /tmp/var-kall.rbxlx --ut /tmp/MN/M.rbxlx --atgard ta-bort
          echo ""
          echo "=== N: Rojos fil PLUS en radbrytning (ska bryta) ==="
          python3 tools/sista-byten.py --in /tmp/rojo-kall.rbxlx --ut /tmp/MN/N.rbxlx --atgard lagg-till

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets ramatning, aldrig exitkoden.
      - name: M — var artefakt utan avslutande radbrytning
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/MN/M.rbxlx --delprov M-var-utan-radbrytning

      - name: N — Rojos fil med avslutande radbrytning
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/MN/N.rbxlx --delprov N-rojo-med-radbrytning
