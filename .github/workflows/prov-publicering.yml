name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# AVVAPNAD. Bisektionen ar kord — run 35570164175. ALLA FYRA armarna
# foll pa 400, inklusive BASEN. Provet mater darfor ingenting:
# BISECT_BASELINE_INVALID, och ingen slutsats far dras om Workspace,
# External eller namespace-attributen.
#
# ORSAKEN LAG I FORSOKSDESIGNEN: basen kallades «Rojo-stil» men kopierade
# bara Rojos ROTELEMENT. Indraget forblev VART (tabbar mot Rojos tva
# mellanslag) och tjansterna lamnades utan barn. Bada holls konstanta
# over alla fyra armar, sa ingen av dem kunde hitta dem.
#
# NASTA DESIGN ska mutera Rojos FAKTISKA bytes — en fil vi vet ger 200 —
# i stallet for att konstruera en fil som borde vara likvardig.
#
# VAD VI VET (run 35569440952 och tidigare):
#
#   Rojo XML      1 645 383 byte  application/xml           -> 200
#   Rojo binart     849 955 byte  application/octet-stream  -> 200
#   VAR XML       1 645 331 byte  application/xml           -> 400
#   var minimala        375 byte  application/xml           -> 400
#
# XML-vagen fungerar alltsa, och felet ligger i VAR EGEN XML.
#
# Bisektionens fyra armar (alla 400, run 35570164175):
#
#   1  basen       438 byte  -> 400   <- ogiltig bas, se ovan
#   2  + Workspace 562 byte  -> 400
#   3  + External  491 byte  -> 400
#   4  + namespace 605 byte  -> 400
#
# Stegen nedan star kvar som dokumentation av vad som kordes. De ska
# INTE koras om som de ar: basen maste bytas mot Rojos faktiska bytes
# innan nasta arm betyder nagonting.
#
# Varje arm kors med --delprov, sa att skriptet redovisar ramatningen
# och INTE klassificerar en orsak pa egen hand: en ensam arm sager
# ingenting, det ar jamforelsen som mater.

on:
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Alla fyra varianterna skrivs av SAMMA generator i samma korning,
      # sa de inte kan glida isar. Generatorn kontrollerar sjalv att var
      # variant ar valformad XML och skriver ut hur manga byte den
      # skiljer sig fran basen.
      - name: Bygg de fyra varianterna
        run: python3 tools/bisektion-xml.py --katalog /tmp/bisekt

      - name: Varianternas skillnad mot basen
        run: |
          echo "head: ${{ github.event.pull_request.head.sha || github.sha }}"
          for v in 2-workspace 3-external 4-namespace; do
            echo "=== bas -> $v ==="
            diff /tmp/bisekt/bisekt-1-bas.rbxlx /tmp/bisekt/bisekt-$v.rbxlx || true
          done

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets ramatning, aldrig exitkoden.
      #
      # ORDNINGEN AR AVSIKTLIG: basen forst. Gar inte den igenom mater
      # provet ingenting, och da ar ingen slutsats om de ovriga giltig.
      # Sekventiellt i samma jobb, sa tva publiceringar aldrig overlappar
      # pa samma place.
      - name: 1/4 — basen
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/bisekt/bisekt-1-bas.rbxlx --delprov 1-bas

      - name: 2/4 — bas + Workspace
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/bisekt/bisekt-2-workspace.rbxlx --delprov 2-workspace

      - name: 3/4 — bas + External
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/bisekt/bisekt-3-external.rbxlx --delprov 3-external

      - name: 4/4 — bas + namespace-attribut
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/bisekt/bisekt-4-namespace.rbxlx --delprov 4-namespace
