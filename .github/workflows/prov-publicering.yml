name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# AVVAPNAD. Forsta omgangen (run 35563663575) ar kord och redovisad.
# Reviewen bestallde «do not publish again yet», sa den automatiska
# `pull_request`-triggern ar BORTTAGEN med flit: en push ska inte kunna
# posta till CI-placen igen.
#
# Att aterarmera ar en rad — satt tillbaka
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#
# nar nasta kontroll ar godkand. `workflow_dispatch` nedan gar INTE att
# trigga fran den har grenen: GitHub exponerar bara dispatch fran
# default-branchen, och filen ligger inte pa main. Den star kvar som
# dokumentation av hur jobbet ser ut, inte som en vag att kora det.
#
# NASTA KONTROLL, nar den bestalls: en OBEROENDE kant-god place — en
# fil Roblox sjalvt skrivit, sparad ur Studio och verifierat aterppnad —
# skickad genom samma endpoint med
#
#   python3 tools/prova-publicering.py --fil <fil> --kand-god
#
# Den handgenererade minimala filen kan aldrig diskriminera, eftersom
# den delar envelope-antaganden med tools/bygg-place.py.

on:
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets klassificeringsrad, aldrig exitkoden.
      - name: Publicering mot CI-placen — matning, inte grind
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py
