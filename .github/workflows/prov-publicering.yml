name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# ARMERAD for MUTATIONSPROVET (order 5756607860). AVVAPNAS DIREKT
# EFTERAT — ta bort `pull_request:` och dess `types:`-rad sa fort
# matningen ar redovisad.
#
# VAD VI VET:
#
#   Rojo XML      1 645 383 byte  application/xml           -> 200
#   Rojo binart     849 955 byte  application/octet-stream  -> 200
#   VAR XML       1 645 331 byte  application/xml           -> 400
#   var minimala        375 byte  application/xml           -> 400
#
# XML-vagen fungerar alltsa, och felet ligger i VAR EGEN XML.
#
# Den forra bisektionen (run 35570164175) var OGILTIG: alla fyra armar
# foll, inklusive basen. Basen kallades «Rojo-stil» men kopierade bara
# Rojos rotelement — indraget forblev vart och tjansterna saknade barn,
# och bada holls konstanta over alla armar.
#
# DARFOR MUTERAS NU ROJOS FAKTISKA BYTES i stallet for att konstruera en
# fil som borde vara likvardig. En mutation av en kant-god fil kan inte
# bara det felet.
#
#   A  Rojos bygge, oforandrat        — basen, maste ge 2xx
#   B  A: tva mellanslags indrag -> tabbar
#   C  A + <External>null/nil
#   D  A + xmlns/xsi/schema-location pa roten
#   E  A + den injicerade Workspace-noden
#
# Ger inte A 2xx ar korningen ogiltig och ingenting far laras av B-E.
#
# Arm E bar med sig bygg-place.py:s TABBINDRAG i sina fem rader, som
# ordern begar «exakt serialiserad form». Ar arm B gron ar E ren; ar B
# rod ar E sammanblandad med den och kan inte tolkas for sig.
#
# Varje arm kors med --delprov, sa att skriptet redovisar ramatningen
# och INTE klassificerar en orsak pa egen hand: en ensam arm sager
# ingenting, det ar jamforelsen som mater.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rojo 7.7.0
        run: |
          curl -sSL -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          sudo install -m 0755 /tmp/rojo/rojo /usr/local/bin/rojo
          rojo --version

      # Basen byggs FARSK ur den exakta head som kors. Arm A ar sedan
      # dess bytes oforandrade — generatorn avbryter om de inte ar
      # byte-identiska.
      - name: Bygg basen och de fem armarna
        run: |
          echo "head: ${{ github.event.pull_request.head.sha || github.sha }}"
          rojo build roblox/default.project.json --output /tmp/rojo-baseline.rbxlx
          sha256sum /tmp/rojo-baseline.rbxlx
          python3 tools/mutera-xml.py --bas /tmp/rojo-baseline.rbxlx --katalog /tmp/mut

      # Pastaendet «exakt en egenskap» granskas i loggen, inte pa mitt
      # ord. Generatorn har redan avbrutit om nagot annat andrats; det
      # har visar skillnaden for en manniska.
      - name: Varje arms skillnad mot A
        run: |
          for v in B-tabbar C-external D-namespace E-workspace; do
            echo "=== A -> $v (forsta 12 raderna av diffen) ==="
            diff /tmp/mut/mut-A-bas.rbxlx /tmp/mut/mut-$v.rbxlx | head -12 || true
          done
          echo "=== CDATA-block oforandrade mellan A och B? ==="
          python3 - <<'PY'
          import re, pathlib
          A = pathlib.Path('/tmp/mut/mut-A-bas.rbxlx').read_text(encoding='utf-8')
          B = pathlib.Path('/tmp/mut/mut-B-tabbar.rbxlx').read_text(encoding='utf-8')
          ca = re.findall(r'<!\[CDATA\[(.*?)\]\]>', A, re.S)
          cb = re.findall(r'<!\[CDATA\[(.*?)\]\]>', B, re.S)
          print('CDATA-block: A=%d B=%d identiska=%s' % (len(ca), len(cb), ca == cb))
          assert ca == cb, 'arm B rorde skriptkallor — provet ar ogiltigt'
          PY

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets ramatning, aldrig exitkoden.
      #
      # ORDNINGEN AR AVSIKTLIG: basen forst. Gar inte den igenom mater
      # provet ingenting, och da ar ingen slutsats om de ovriga giltig.
      # Sekventiellt i samma jobb, sa tva publiceringar aldrig overlappar
      # pa samma place.
      - name: 1/5 — basen, Rojos bytes oforandrade
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/mut/mut-A-bas.rbxlx --delprov A-bas

      - name: 2/5 — indrag -> tabbar
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/mut/mut-B-tabbar.rbxlx --delprov B-tabbar

      - name: 3/5 — + External-noderna
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/mut/mut-C-external.rbxlx --delprov C-external

      - name: 4/5 — + namespace-attribut
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/mut/mut-D-namespace.rbxlx --delprov D-namespace

      - name: 5/5 — + Workspace-noden
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/mut/mut-E-workspace.rbxlx --delprov E-workspace
