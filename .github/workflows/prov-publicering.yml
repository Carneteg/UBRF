name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# AVVAPNAD. Den binara matningen ar kord och redovisad — run 35566621297,
# job 106229674956, HTTP 200, {"versionNumber":3}, BINARY_PATH_PASS.
# `pull_request`-triggern ar borttagen igen sa att en push inte kan
# republicera baseplaten till CI-placen av vana. `workflow_dispatch` gar
# anda inte att trigga fran den har grenen: GitHub exponerar bara
# dispatch fran default-branchen, och filen ligger inte pa main.
#
# ATERARMERA genom att satta tillbaka
#
#   pull_request:
#     types: [opened, synchronize, reopened, ready_for_review]
#
# nar nasta kontroll ar godkand. Den kontrollen ar samma baseplate
# sparad som XML — byt run-raden till `--fil qa/runtime/
# UBRFCI-known-good.rbxlx` med filens egen sha256. Ingen kodandring
# behovs: content-type valjs ur magic bytes.
#
# KONTROLLEN: qa/runtime/UBRFCI-known-good.rbxl ar en stock Baseplate
# sparad ur Studio — binar container med Roblox egen magi `<roblox!`,
# full DataModel, ingen UBRF-kod. Att den ar skriven av Roblox sjalvt
# gar inte att ifragasatta: det binara formatet kan inte handskrivas,
# till skillnad fran XML-envelopen.
#
# VAD DEN KAN OCH INTE KAN: gar den igenom ar nyckelns scope, CI-placens
# tillstand, endpointen och auth bevisat i ordning — men XML-vagen ar
# fortfarande oprovad, eftersom wire-formatet skilde sig. Faller den med
# samma «Invalid Content stream» kan var generator inte forklara det,
# och svaret ar API_OR_SETUP.
#
# En binar .rbxl MASTE skickas som application/octet-stream. Skriptet
# valjer typ ur filens FORSTA BYTES, aldrig ur dess namn.

on:
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Kontrollfilens bytes maste vara DESAMMA i checkouten som de var
      # nar de granskades. Skriptet kontrollerar det sjalvt via
      # --vantad-sha256, men raden nedan gor hashen synlig i loggen aven
      # nar provet stoppar.
      - name: Kontrollfilens hash i checkouten
        run: sha256sum qa/runtime/UBRFCI-known-good.rbxl

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets klassificeringsrad, aldrig exitkoden.
      - name: Publicering mot CI-placen — matning, inte grind
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: |
          python3 tools/prova-publicering.py \
            --fil qa/runtime/UBRFCI-known-good.rbxl \
            --kand-god \
            --vantad-sha256 bc77e4edc8685066d6bdab59c2d6aacbb9e37d657a8e35104f5c928fb32c7400
