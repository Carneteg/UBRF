name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# ARMERAD for SOURCE-TYPPROVET (order 5756689051). AVVAPNAS DIREKT
# EFTERAT — ta bort `pull_request:` och dess `types:`-rad sa fort
# matningen ar redovisad.
#
# VAGEN HIT: mutationsprovet (run 35570961741) gav 200 pa alla fem
# armar och uteslot tabbar, External, namespace-attribut och Workspace.
# En instansvis jamforelse mellan var artefakt och Rojos visade da att
# filerna ar nastan identiska — samma 75 moduler, samma tjanster — utom
# i EN systematisk sak:
#
#     var  (400):  <ProtectedString name="Source">   x77
#     Rojo (200):  <string name="Source">            x77
#
# ProtectedString ar en sakerhetsskyddad vardetyp. En ingester som inte
# tar emot skriptkallor under skyddad typ fran en otrodd uppladdning,
# men accepterar vanlig string, ger exakt det monster vi ser.
#
# PROVET GAR AT BADA HALLEN, vilket ar poangen:
#
#   F  Rojos fil, string -> ProtectedString   ska BRYTA en fil som gar igenom
#   G  var fil, ProtectedString -> string     ska LAGA en fil som faller
#
#   F=400 och G=200  -> SOURCE_TYPE_CONFIRMED
#   F=200 och G=200  -> typen ar inte blockeraren
#   F=400 och G=400  -> bara delvis korrelation
#
# G ar den viktigaste armen: den provar VAR FAKTISKA ARTEFAKT, inte en
# stallforetradare.
#
# FALLAN i bytet: stangningstaggen `</string>` anvands ocksa av
# `<string name="Name">`. En naiv sok-och-ersatt hade dodat varje
# Name-egenskap i filen. tools/byt-source-typ.py matchar darfor hela
# elementet och bevisar bytet genom att det OMVANDA bytet maste ge
# tillbaka originalets exakta bytes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rojo 7.7.0
        run: |
          curl -sSL -o /tmp/rojo.zip             https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          sudo install -m 0755 /tmp/rojo/rojo /usr/local/bin/rojo
          rojo --version

      # De tva kallartefakterna: Rojos (kand 200) och var egen (kand 400).
      # Bada byggs ur exakt den head som kors.
      - name: Bygg kallartefakterna
        env:
          UBRF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "head: $UBRF_HEAD_SHA"
          rojo build roblox/default.project.json --output /tmp/rojo-kall.rbxlx
          python3 tools/bygg-place.py --ut /tmp/var-kall.rbxlx --sha "$UBRF_HEAD_SHA"
          echo "=== KALLARTEFAKTERNA ==="
          for f in /tmp/rojo-kall.rbxlx /tmp/var-kall.rbxlx; do
            echo "$f"
            echo "  storlek : $(stat -c%s "$f") byte"
            echo "  sha256  : $(sha256sum "$f" | cut -d' ' -f1)"
            echo "  Source  : ProtectedString=$(grep -o '<ProtectedString name=\"Source\">' "$f" | wc -l) string=$(grep -o '<string name=\"Source\">' "$f" | wc -l)"
          done

      # Bytesverktyget bevisar sjalvt att bara taggnamnen andrats: det
      # omvanda bytet maste ge tillbaka originalets exakta bytes, CDATA
      # maste vara oforandrat och antalet <string name="Name"> lika.
      # Avbryter annars.
      - name: F och G — byt Source-typ, med bevis
        run: |
          echo "=== F: Rojos fil, string -> ProtectedString (ska bryta) ==="
          python3 tools/byt-source-typ.py --in /tmp/rojo-kall.rbxlx --ut /tmp/fg/F.rbxlx --till protected
          echo ""
          echo "=== G: var fil, ProtectedString -> string (ska laga) ==="
          python3 tools/byt-source-typ.py --in /tmp/var-kall.rbxlx --ut /tmp/fg/G.rbxlx --till string

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets ramatning, aldrig exitkoden.
      # Sekventiellt i samma jobb, sa tva publiceringar aldrig overlappar.
      - name: F — Rojos fil med ProtectedString
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/fg/F.rbxlx --delprov F-rojo-protected

      - name: G — var fil med string
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/fg/G.rbxlx --delprov G-var-string
