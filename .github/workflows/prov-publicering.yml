name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# AVVAPNAD. J/K ar kort — run 35573405949:
#
#   J  Rojos fil + BADA vara egenskaper  -> 200 (version 12)
#   K  var fil  - BADA                   -> 400
#
# ENUMERATED_DIFFS_EXHAUSTED. Referentstil och RunContext ar uteslutna.
#
# MEN: alla egenskaper ar provade EN OCH EN, aldrig i KOMBINATION. K bar
# fortfarande tabbar, ProtectedString, Workspace, External och
# namespace-roten SAMTIDIGT. Nasta prov ska lagga alla pa Rojos fil pa
# en gang.
#
# UTESLUTET HITTILLS, allt matt och inget antaget: formatet (XML
# fungerar), nyckel, scope, endpoint, auth, tabbindrag, <External>,
# namespace-attribut, Workspace-noden, och source-typen ProtectedString
# kontra string — den sista provad at bada hallen (F=200, G=400).
#
# KVAR I DEN UPPRAKNADE MANGDEN star tva saker:
#
#     referentstil    var RBX0..RBX82   Rojo 0..81
#     RunContext      var saknas        Rojo <token name="RunContext">0</token>
#
# Bada laggs pa EN GANG, at bada hallen, sa att mangden toms i samma
# tva publiceringar:
#
#   J  Rojos fil + BADA   -> 400: orsaken finns i mangden, bisektera inuti
#   K  var fil  - BADA    -> 200: bekraftar fran andra hallet
#
#   J=200 och K=400 -> mangden ar TOM pa forklaringar. Blockeraren
#   ligger utanfor allt jag lyckats rakna upp, och da ar delta-debugging
#   av den riktiga artefakten ratt nasta metod — inte fler gissningar.
#
# Det utfallet ar det troliga: referenter ar OANVANDA i bada filerna
# (noll <Ref>-egenskaper), och Roblox egen serializer skriver sjalv
# RBX-prefixade referenter.

on:
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rojo 7.7.0
        run: |
          curl -sSL -o /tmp/rojo.zip             https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          sudo install -m 0755 /tmp/rojo/rojo /usr/local/bin/rojo
          rojo --version

      # De tva kallartefakterna: Rojos (kand 200) och var egen (kand 400).
      # Bada byggs ur exakt den head som kors.
      - name: Bygg kallartefakterna
        env:
          UBRF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "head: $UBRF_HEAD_SHA"
          rojo build roblox/default.project.json --output /tmp/rojo-kall.rbxlx
          python3 tools/bygg-place.py --ut /tmp/var-kall.rbxlx --sha "$UBRF_HEAD_SHA"
          for f in /tmp/rojo-kall.rbxlx /tmp/var-kall.rbxlx; do
            echo "$f  $(stat -c%s "$f") byte  $(sha256sum "$f" | cut -d' ' -f1)"
          done

      # Verktyget bevisar sjalvt varje pastaende och avbryter annars:
      # noll <Ref>-egenskaper, referentbytet reversibelt till originalet,
      # RunContext-andringen reversibel, CDATA oforandrat, antalet
      # referenter lika fore och efter.
      - name: J och K — alla kvarvarande skillnader, med bevis
        run: |
          echo "=== J: Rojos fil + BADA skillnaderna (ska bryta) ==="
          python3 tools/kvarvarande-diff.py --in /tmp/rojo-kall.rbxlx --ut /tmp/jk/J.rbxlx --riktning j
          echo ""
          echo "=== K: var fil - BADA skillnaderna (ska laga) ==="
          python3 tools/kvarvarande-diff.py --in /tmp/var-kall.rbxlx --ut /tmp/jk/K.rbxlx --riktning k

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets ramatning, aldrig exitkoden.
      # Sekventiellt i samma jobb, sa tva publiceringar aldrig overlappar.
      - name: J — Rojos fil med vara egenskaper
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/jk/J.rbxlx --delprov J-rojo-med-vara

      - name: K — var fil med Rojos egenskaper
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/jk/K.rbxlx --delprov K-var-med-rojos
