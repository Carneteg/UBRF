name: Prov — minimal publicering

# TILLFALLIG DIAGNOSTIK for #264. Tas bort nar fragan ar besvarad.
#
# AVVAPNAD. Parprovet ar kort och redovisat — run 35569440952:
# XML 200 (version 4), binart 200 (version 5). `workflow_dispatch` gar
# anda inte att trigga fran den har grenen: GitHub exponerar bara
# dispatch fran default-branchen, och filen ligger inte pa main.
#
# VAD PARPROVET VISADE: Rojo byggde bada formaten ur samma projektfil,
# samma serializer, samma commit — bara wire-formatet skilde. BADA gick
# igenom.
#
#   Rojo XML      1 645 383 byte  application/xml           -> 200
#   Rojo binart     849 955 byte  application/octet-stream  -> 200
#   VAR XML       1 645 331 byte  application/xml           -> 400
#   var minimala        375 byte  application/xml           -> 400
#
# XML-VAGEN FUNGERAR ALLTSA. Felet ligger i VAR EGEN XML, inte i
# formatet och inte i API:t. Det valter den lutning jag hade innan
# provet kordes.
#
# Skillnaderna mellan var envelope och Rojos, som nasta bisektion ska
# provas mot en och en:
#
#   var:   <roblox xmlns:xmime=... xmlns:xsi=... xsi:noNamespace... version="4">
#          <External>null</External> + <External>nil</External>
#          referent="RBX0", tabbindrag
#   Rojo:  <roblox version="4">
#          inga External-noder
#          referent="0", tva mellanslag
#
# En binar .rbxl MASTE skickas som application/octet-stream. Skriptet
# valjer typ ur filens FORSTA BYTES, aldrig ur dess namn.

on:
  workflow_dispatch:

# SAMMA grupp som runtime-grind.yml. Provet publicerar till SAMMA place
# som grinden, och tva publiceringar samtidigt skriver over varandra —
# da mater en av korningarna fel bygge. En i taget, over bada
# workflowsen.
concurrency:
  group: runtime-grind
  cancel-in-progress: false

jobs:
  prov-publicering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bada filerna byggs HAR, i samma jobb, av samma binar. Da kan de
      # inte komma ur olika Rojo-versioner — vilket ar hela poangen med
      # ett parprov: en enda variabel far skilja dem at.
      - name: Rojo 7.7.0
        run: |
          curl -sSL -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          sudo install -m 0755 /tmp/rojo/rojo /usr/local/bin/rojo
          rojo --version

      - name: Bygg bada formaten ur samma projektfil
        run: |
          rojo build roblox/default.project.json --output /tmp/rojo-control.rbxlx
          rojo build roblox/default.project.json --output /tmp/rojo-control.rbxl
          echo "=== KONTROLLFILERNA ==="
          for f in /tmp/rojo-control.rbxlx /tmp/rojo-control.rbxl; do
            printf '%s\n  storlek : %s byte\n  sha256  : %s\n  magi    : %s\n' \
              "$f" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" \
              "$(head -c 8 "$f" | xxd -p)"
          done
          echo "  head    : ${{ github.event.pull_request.head.sha || github.sha }}"
          echo "  projekt : roblox/default.project.json (samma for bada)"

      # Gron exitkod betyder «matning erhallen», inte «publicering
      # lyckades». Las skriptets klassificeringsrad, aldrig exitkoden.
      # PARPROVETS ORDNING: XML forst, binar sedan. Sekventiellt i samma
      # jobb, sa tva publiceringar aldrig overlappar pa samma place.
      - name: 1/2 — XML mot CI-placen
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/rojo-control.rbxlx --tredjepart

      - name: 2/2 — binart mot CI-placen
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UBRF_UNIVERSE_ID: ${{ vars.UBRF_UNIVERSE_ID }}
          UBRF_CI_PLACE_ID: ${{ vars.UBRF_CI_PLACE_ID }}
        run: python3 tools/prova-publicering.py --fil /tmp/rojo-control.rbxl --tredjepart
