name: Ugneta pedagogik och UX

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  ugneta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript-syntax
        run: node --check src/larare.js
      - name: Pedagogik, lektionspaket och responsiv UX
        run: node tools/ugnetatest.mjs
